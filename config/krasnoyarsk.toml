# Регион мониторинга. Расширение на другой регион Сибири — правка этого файла,
# без изменений в коде (SPEC-1, AC-01).

[region]
name = "Красноярский край"
# FIRMS Area API ждёт порядок west,south,east,north
bbox = [82.0, 51.0, 109.0, 78.0]

[firms]
# LANDSAT_NRT здесь быть не может: продукт покрывает только США и Канаду
# (проверено 18.09.2026, docs/TZ.md §3.1). Список допустимых источников
# зашит в src/firms.py::ALLOWED_SOURCES и не переопределяется конфигом.
sources = [
    "VIIRS_SNPP_NRT",
    "VIIRS_NOAA20_NRT",
    "VIIRS_NOAA21_NRT",
    "MODIS_NRT",
]
# Максимум, который принимает FIRMS Area API, — 5 суток за запрос.
day_range = 2

[confidence]
# VIIRS отдаёт категориальную шкалу l/n/h, MODIS — числовую 0-100.
# Границы MODIS настраиваемы: соответствие числовой шкалы категориальной
# не является тождеством и подлежит явной фиксации (SPEC-3).
modis_low_below = 30       # confidence < 30        -> low
modis_high_at_least = 80   # confidence >= 80       -> high
                           # всё между ними         -> nominal
# Минимальный уровень, попадающий в основной слой. `low` у VIIRS —
# основной источник ложных срабатываний (ФТ-1.3).
min_level = "nominal"

[cropland]
# ESA WorldCover через Planetary Computer: анонимно, CC-BY-4.0, класс 40 = Cropland.
# Слой статичен (эпохи 2020 и 2021, обновлений не будет), поэтому сезонность
# задаётся календарным окном применения, а не сменой слоя (SPEC-5).
cache_dir = "data/worldcover"
epoch = 2021
# Уровень оверзума тайла 3x3 град. 16 -> ~150 м. Проверено: оверзумы WorldCover
# категориально-безопасны (только валидные классы), доля cropland на уровне 16
# отличается от полного разрешения на 0.2 п.п. VIIRS-пиксель — 375 м.
overview = 16
# Окна сельхозпалов, MM-DD/MM-DD включительно. Весенние и осенние палы.
burn_windows = ["04-01/05-31", "09-01/10-31"]

[persistence]
# Газовые факелы горят неделями в одной точке; пожар движется. Это единственный
# признак, доступный без сырой радиометрии (SPEC-4).
window_days = 14          # окно анализа
radius_m = 500            # радиус, в пределах которого детекции считаются одним источником
min_distinct_days = 10    # на скольких РАЗНЫХ сутках окна источник должен присутствовать.
                          # Не 14: облачность и геометрия орбит дают пропуски.
# Коэффициент вариации FRP. Факел стабилен по мощности, пожар — нет.
# null отключает проверку интенсивности.
max_frp_cv = 0.6

[events]
# Пожар наблюдается как облако отдельных пикселей от разных сенсоров и пролётов.
# Пользователю нужен один очаг, этапу 2 — устойчивый идентификатор и границы (SPEC-6).
radius_m = 3000        # связывание детекций в одно событие; пиксель VIIRS — 375 м
time_gap_hours = 48    # разрыв, после которого начинается новое событие
# Завершение события: столько суток БЕЗ детекций ПРИ НАЛИЧИИ наблюдений.
# Без второго условия сбой источника или сплошная облачность тушили бы пожар в базе.
completion_days = 7
min_observations = 1   # сколько подтверждённых наблюдений требуется в окне тишины
